# Database Configuration
jdbc.driverClassName = com.mysql.cj.jdbc.Driver
# See voj-test.properties in the web module: createDatabaseIfNotExist lets the
# test suite provision its own schema, and sql_mode=STRICT_TRANS_TABLES keeps
# strict validation while dropping ONLY_FULL_GROUP_BY and NO_ZERO_DATE.
jdbc.url = jdbc:mysql://localhost:3306/test?characterEncoding=UTF-8&serverTimezone=UTC&createDatabaseIfNotExist=true&sessionVariables=sql_mode='STRICT_TRANS_TABLES'&connectTimeout=10000&socketTimeout=15000
jdbc.username = root
jdbc.password = 
jdbc.initialSize = 1
jdbc.maxActive = 4
jdbc.minIdle = 0
jdbc.maxWait = 1800
jdbc.timeBetweenEvictionRunsMillis = 1800
jdbc.minEvictableIdleTimeMillis = 1800
jdbc.removeAbandoned = false
jdbc.removeAbandonedTimeout = 1800

# Message Service Configuration
jms.broker.url = vm://localhost?broker.persistent=false

# Authentication for voj 
judger.username = 
judger.password = 
judger.description =  

# Directories: test.workDir is where the sandbox tests judge (the judger itself
# judges under judger.checkpointDir). The directory of each judging there gets an
# ACL of its own, which lets the sandbox account into its program and run
# directories. Run the tests as an elevated administrator, as the judger (see
# docs/deployment.md): the sandbox needs its privileges.
test.workDir = C:/Windows/Temp
judger.checkpointDir = C:/Windows/Temp/testpoints

# Checkpoint Distribution Configuration (unused by the unit tests, which mock the store)
judger.web.baseUrl = http://localhost:8080/voj
judger.apiToken =

# The account the sandbox runs programs as: a local account of its own with the "Log on as a
# batch job" right, never the account that runs the tests, which the judger refuses (it keeps the
# sandbox account off the network). appveyor.yml creates it and sets its password here; see
# "The sandbox account" in docs/deployment.md to create one yourself.
system.username = voj-sandbox
system.password =
