# Deployment knobs are resolved at runtime from environment variables, with the
# value after ':' used as the fallback, so every VOJ_* below can be overridden
# without rebuilding the jar, e.g. `docker run -e VOJ_DB_HOST=db.internal ...`.
# A judger must reach the web app's database and message broker, and present the
# same VOJ_JUDGER_API_TOKEN as the web app to download test data.

# Database Configuration
# Times are written and read in UTC on a UTC session, like the web application does, so both read
# the same instant from a column whatever the database server's time zone. A connection must be
# opened within connectTimeout ms, and a statement answered within socketTimeout ms: a connection
# that went silent (e.g. half-open after a network failure) fails then, rather than holding up a
# judging or the renewal of its lease (60 s) forever. Every statement of the judger is short.
jdbc.driverClassName = com.mysql.cj.jdbc.Driver
jdbc.url = jdbc:mysql://${VOJ_DB_HOST:localhost}:${VOJ_DB_PORT:3306}/${VOJ_DB_NAME:voj}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=10000&socketTimeout=15000
jdbc.username = ${VOJ_DB_USERNAME:root}
jdbc.password = ${VOJ_DB_PASSWORD:}
jdbc.initialSize = 1
jdbc.maxActive = 4
jdbc.minIdle = 1
jdbc.maxWait = 30000
jdbc.timeBetweenEvictionRunsMillis = 60000
jdbc.minEvictableIdleTimeMillis = 25200000
jdbc.removeAbandoned = false
jdbc.removeAbandonedTimeout = 1800

# Message Service Configuration
# The judger publishes the progress of its judgings to every instance of the web application here
# (on a topic). The judger takes the pending submissions in the languages it supports from the
# database, the one queued first first, judges one at a time, and records its heartbeats there too:
# the policy of that queue is the same on every judger (see docs/configuration.md). A judging that
# fails sends its submission to the end of the queue: counting the failure on it if the submission
# may have caused it (a System Error after 5 such judgings), not if the judger or its environment
# failed (e.g. the web application is down). After 3 failed judgings in a row the judger is not
# ready and retries at most every minute.
jms.broker.url = ${VOJ_JMS_BROKER_URL:tcp://localhost:61616}

# Authentication for voj
judger.username = ${VOJ_JUDGER_USERNAME:voj@judger}
judger.password = ${VOJ_JUDGER_PASSWORD:}
judger.description = ${VOJ_JUDGER_DESCRIPTION:}

# Working Directory
# Each judger on a host claims the first slot n under judger.checkpointDir whose
# lock file judger-<n>.lock no other judger holds: it caches test data in
# judger-<n>/ there and judges in work-<n>/ there, which it empties when it
# starts. Judgers may share the directory. It must belong to the judger and not
# be writable by its group or others; a missing one is created rwx--x--x.
# Empty: /var/lib/voj-judger (%ProgramData%\voj-judger on Windows), which a
# judger that is not root (Administrator) may need to be given, or pointed
# elsewhere: it does not start without it. Never in the temporary directory,
# whose clean-up of old files would remove the test data and the lock files.
judger.checkpointDir = ${VOJ_JUDGER_CHECKPOINT_DIR:}

# Checkpoint Distribution Configuration
# The judger downloads a problem's test data from the web application and caches it under
# judger.checkpointDir, re-fetching only when the problem's checkpoints version changes. baseUrl is
# the web application's root; apiToken is the shared secret and must match judger.apiToken on the web.
judger.web.baseUrl = ${VOJ_WEB_BASE_URL:http://localhost:8080/voj}
# How long (seconds) a download of a problem's test data may take as a whole,
# from the request to the last byte. A download that is not over by then fails.
judger.web.downloadTimeout = 300
# Left empty (or wrong), the web application refuses every download (HTTP 403): the
# judgings of this judger fail and it is soon not ready (the judger logs an error at
# startup when it is empty).
judger.apiToken = ${VOJ_JUDGER_API_TOKEN:}

# Sandbox backend. "isolate" (Linux, as root, with isolate installed) runs each
# program in an isolate box (namespaces and cgroups): recommended for Linux in
# production. "native" is the JNI runner (rlimits, Landlock and seccomp filters,
# and system.username when the judger is root, on Linux; a restricted
# Low-integrity token of system.username, a Job Object and a network filter on
# Windows): the backend on Windows, and on Linux for a judger that is not root.
# Both enforce the same commands and limits, judged alike (docs/deployment.md).
judger.sandbox = native

# CPU time limit (milliseconds) allowed for compiling a submission. Heavyweight
# toolchains (the Go build driver, the JVM-based Kotlin compiler) need much more
# than a few seconds, otherwise the sandbox kills them and reports a spurious
# "Compile Error".
judger.compileTimeLimit = 20000

# Memory limit (kilobytes) allowed for compiling a submission, scaled by the
# language's memory multiplier (as the memory limit of a run is). Caps "compiler
# bombs" (e.g. C++ template recursion) so they cannot OOM the host. The native
# sandbox measures the compiler's top-level process against it and holds every
# process the compiler runs (cc1plus, the Go compiler and linker, ...) to a
# kernel backstop of twice this limit plus headroom (RLIMIT_DATA). Keep it
# generous enough for the Go linker and rustc; kotlinc (a JVM with its own
# 512 MB heap, peaking around 550 MB) gets 1 GB through Kotlin's multiplier of 2.
# Default: 512 MB.
judger.compileMemoryLimit = 524288

# Maximum number of threads a run of a submission may have at once, on Linux,
# where a run is a single process (RLIMIT_NPROC, or isolate's --processes, both
# count threads). A Windows Job counts processes only: a run is held to its
# one process (and the console host Windows starts for it).
judger.processLimit = 64

# Maximum number of processes (and threads) a compilation may have at once. The
# compilers are trusted programs, but the Go toolchain runs one compiler per CPU,
# each with up to a thread per CPU, so a small cap fails `go build` with EAGAIN
# on a many-core host. Used by both sandbox backends.
judger.compileProcessLimit = 1024

# Largest file (kilobytes) a compilation or run may write, its output included:
# a run whose output reaches it is Output Limit Exceeded. Default: 256 MB.
judger.outputLimit = 262144

# A read-only Go build cache (a root-owned directory, files not writable by
# anyone else) that each Go submission's private build cache is seeded from, so
# the standard library is not rebuilt for every submission. Empty: every Go
# build starts from an empty cache. The Docker image builds one and sets
# VOJ_GO_BUILD_CACHE_SEED.
judger.goBuildCacheSeed = ${VOJ_GO_BUILD_CACHE_SEED:}

# isolate sandbox configuration (only used when judger.sandbox = isolate)
judger.isolate.executable = isolate
judger.isolate.boxId = 0
# isolate runs box n as UID first_uid + n; the judger hands each submission's
# (private, 0700) program and run directories to that UID. Must match first_uid in isolate's
# configuration file (isolate's default is 60000).
judger.isolate.firstUid = 60000
# Extra directories bound read-only into the box (isolate --dir rules,
# comma-separated) for toolchains outside isolate's default mounts: the
# alternatives symlinks behind javac/cc/fpc and /opt (Go, Kotlin).
judger.isolate.extraDirs = /etc/alternatives:maybe,/opt:maybe
# Host files (name=hostPath, comma-separated) copied into a compilation's work
# directory, its HOME, for
# compiler configuration files outside isolate's mounts: isolate binds
# directories only. Free Pascal reads ~/.fpc.cfg before /etc/fpc.cfg.
judger.isolate.compileFiles = .fpc.cfg=/etc/fpc.cfg
# isolate's syscall filter flags (--syscalls) for a compilation; empty to use
# isolate's configured syscall_flags (and for an isolate without --syscalls).
# 27 keeps every restriction but the one on file locks (flag 4), which the Go
# build cache needs; runs of the submission keep all of them.
judger.isolate.compileSyscalls = 27

# Unprivileged user the native sandbox drops to before running a submission
# (Linux: any non-root account, "nobody" works out of the box; the password is
# unused on Linux and required only on Windows for the separate logon account).
# The judger only ever kills the processes of its own runs, never other
# processes of the account, but RLIMIT_NPROC (which caps a run's threads)
# counts every process of the account: on a bare host where other services run
# as "nobody", use a dedicated account (see docs/deployment.md). Every judger
# on a host needs an account of its own, as it needs an isolate box of its own:
# a judger running as root does not start if another one uses its account.
system.username = nobody
system.password =