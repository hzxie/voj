# Deployment knobs are resolved at runtime from environment variables, with the
# value after ':' used as the fallback, so every VOJ_* below can be overridden
# without rebuilding the jar, e.g. `docker run -e VOJ_DB_HOST=db.internal ...`.
# A judger must reach the web app's database and message broker, and present the
# same VOJ_JUDGER_API_TOKEN as the web app to download test data.

# Database Configuration
jdbc.driverClassName = com.mysql.cj.jdbc.Driver
jdbc.url = jdbc:mysql://${VOJ_DB_HOST:localhost}:${VOJ_DB_PORT:3306}/${VOJ_DB_NAME:voj}?characterEncoding=UTF-8&serverTimezone=UTC
jdbc.username = ${VOJ_DB_USERNAME:root}
jdbc.password = ${VOJ_DB_PASSWORD:}
jdbc.initialSize = 1
jdbc.maxActive = 4
jdbc.minIdle = 1
jdbc.maxWait = 30000
jdbc.timeBetweenEvictionRunsMillis = 60000
jdbc.minEvictableIdleTimeMillis = 25200000
jdbc.removeAbandoned = false
jdbc.removeAbandonedTimeout = 1800

# Message Service Configuration
jms.broker.url = ${VOJ_JMS_BROKER_URL:tcp://localhost:61616}

# Authentication for voj
judger.username = ${VOJ_JUDGER_USERNAME:voj@judger}
judger.password = ${VOJ_JUDGER_PASSWORD:}
judger.description = ${VOJ_JUDGER_DESCRIPTION:}

# Working Directory
judger.workDir = ${VOJ_JUDGER_WORK_DIR:/tmp}
judger.checkpointDir = ${VOJ_JUDGER_CHECKPOINT_DIR:/tmp/voj-testpoints}

# Checkpoint Distribution Configuration
# The judger downloads a problem's test data from the web application and caches it under
# judger.checkpointDir, re-fetching only when the problem's checkpoints version changes. baseUrl is
# the web application's root; apiToken is the shared secret and must match judger.apiToken on the web.
judger.web.baseUrl = ${VOJ_WEB_BASE_URL:http://localhost:8080/voj}
# Left empty, the web application refuses every download and every submission is
# judged a System Error (the judger logs an error at startup).
judger.apiToken = ${VOJ_JUDGER_API_TOKEN:}

# Sandbox backend. "native" is the in-process JNI runner: on Linux it confines
# submissions with setrlimit + a network namespace + a seccomp syscall filter and
# drops privileges to system.username; on Windows it runs them under a separate
# low-privilege account. "isolate" (Linux only) delegates to the external isolate
# tool instead and requires it to be installed.
judger.sandbox = native

# CPU time limit (milliseconds) allowed for compiling a submission. Heavyweight
# toolchains (the Go build driver, the JVM-based Kotlin compiler) need much more
# than a few seconds, otherwise the sandbox kills them and reports a spurious
# "Compile Error".
judger.compileTimeLimit = 20000

# Memory limit (kilobytes) allowed for compiling a submission, scaled by the
# language's memory multiplier (as the memory limit of a run is). Caps "compiler
# bombs" (e.g. C++ template recursion) so they cannot OOM the host. The native
# sandbox measures the compiler's top-level process against it and holds every
# process the compiler runs (cc1plus, the Go compiler and linker, ...) to a
# kernel backstop of twice this limit plus headroom (RLIMIT_DATA). Keep it
# generous enough for the Go linker and rustc; kotlinc (a JVM with its own
# 512 MB heap, peaking around 550 MB) gets 1 GB through Kotlin's multiplier of 2.
# Default: 512 MB.
judger.compileMemoryLimit = 524288

# Maximum number of processes a submission may have at once (anti fork-bomb).
# The native sandbox on Linux does not let a run create processes at all; this
# is then the sandbox user's RLIMIT_NPROC, which caps the run's threads. isolate
# applies it with --processes, which counts threads too.
judger.processLimit = 64

# Maximum number of processes (and threads) a compilation may have at once. The
# compilers are trusted programs, but the Go toolchain runs one compiler per CPU,
# each with up to a thread per CPU, so a small cap fails `go build` with EAGAIN
# on a many-core host. Used by both sandbox backends.
judger.compileProcessLimit = 1024

# A read-only Go build cache (a root-owned directory, files not writable by
# anyone else) that each Go submission's private build cache is seeded from, so
# the standard library is not rebuilt for every submission. Empty: every Go
# build starts from an empty cache. The Docker image builds one and sets
# VOJ_GO_BUILD_CACHE_SEED.
judger.goBuildCacheSeed = ${VOJ_GO_BUILD_CACHE_SEED:}

# isolate sandbox configuration (only used when judger.sandbox = isolate)
judger.isolate.executable = isolate
judger.isolate.boxId = 0
# isolate runs box n as UID first_uid + n; the judger hands each submission's
# (private, 0700) work directory to that UID. Must match first_uid in isolate's
# configuration file (isolate's default is 60000).
judger.isolate.firstUid = 60000
# Extra directories bound read-only into the box (isolate --dir rules,
# comma-separated) for toolchains outside isolate's default mounts: the
# alternatives symlinks behind javac/cc/fpc and /opt (Go, Kotlin).
judger.isolate.extraDirs = /etc/alternatives:maybe,/opt:maybe
# Host files copied into the box before a compilation (boxName=hostPath,
# comma-separated), for compiler configuration files outside isolate's mounts:
# isolate binds directories only. The box is the compiler's working directory
# and HOME; Free Pascal reads ~/.fpc.cfg before /etc/fpc.cfg.
judger.isolate.compileFiles = .fpc.cfg=/etc/fpc.cfg
# isolate's syscall filter flags (--syscalls) for a compilation; empty to use
# isolate's configured syscall_flags (and for an isolate without --syscalls).
# 27 keeps every restriction but the one on file locks (flag 4), which the Go
# build cache needs; runs of the submission keep all of them.
judger.isolate.compileSyscalls = 27
judger.isolate.wallTimeBufferSec = 1.0
# Maximum size (kilobytes) of files the sandboxed program may create (disk-bomb
# guard). Mirrors the native runner's 256 MB RLIMIT_FSIZE. 0 means no limit.
judger.isolate.fileSizeLimitKb = 262144

# Unprivileged user the native sandbox drops to before running a submission
# (Linux: any non-root account, "nobody" works out of the box; the password is
# unused on Linux and required only on Windows for the separate logon account).
# The account must be dedicated to the judger: after every run all processes
# owned by it are killed. On a bare host where other services run as "nobody",
# use a dedicated account (see docs/deployment.md).
system.username = nobody
system.password =