[supervisord]
nodaemon=true

[program:mysqld]
command=/etc/init.d/mariadb start

[program:activemq]
# Start the standalone broker only when the web app is NOT hosting an embedded one.
# With VOJ_JMS_BROKER_EMBEDDED=true (the image default) the web process runs the broker
# itself, so this block exits immediately and supervisord leaves it stopped — saving
# a whole broker JVM (~150 MB+). Run with `-e VOJ_JMS_BROKER_EMBEDDED=false` to use this
# instead (the same variable the web app reads, so the two never disagree).
command=bash -c 'if [ "${VOJ_JMS_BROKER_EMBEDDED:-true}" = "true" ]; then echo "Embedded broker in use; standalone ActiveMQ skipped."; exit 0; fi; exec /opt/activemq/bin/activemq start'
# Cap the broker heap (ActiveMQ defaults to -Xmx1g) for the small-demo footprint.
environment=ACTIVEMQ_OPTS_MEMORY="-Xms32m -Xmx128m"
# The conditional command above exits 0 when embedded; treat that as success, not a crash.
startsecs=0
autorestart=false

[program:voj-web]
# Waits for the database, then starts the app (see start-web.sh). Its output goes
# to the container log, where the first start prints the generated credentials.
command=/opt/voj/start-web.sh
directory=/opt/voj
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

