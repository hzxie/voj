# # version: "{branch} {build}"
image:
# Windows Server 2022
- Visual Studio 2022

environment:
  appveyor_build_worker_cloud: gce
  appveyor_rdp_password: Fx8eHPNesxhpmdru
  matrix:
  - JAVA_HOME: C:\Program Files\Java\jdk17
  - JAVA_HOME: C:\Program Files\Java\jdk21
  - JAVA_HOME: C:\Program Files\Java\jdk25

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: Start-Service MySQL80

install:
  - set MINGW_HOME=C:\mingw-w64\x86_64-8.1.0-posix-seh-rt_v6-rev0\mingw64
  - set PATH=%MINGW_HOME%\bin;C:\cygwin64\bin;C:\Program Files\MySql\MySQL Server 8.0\bin;%PATH%
# Fix bug for mkdir in AppVeyor
  - del "C:\Program Files\Git\usr\bin\mkdir.exe"
# Fix path error for make
  - copy "C:\mingw-w64\x86_64-8.1.0-posix-seh-rt_v6-rev0\mingw64\bin\mingw32-make.exe" "C:\mingw-w64\x86_64-8.1.0-posix-seh-rt_v6-rev0\mingw64\bin\make.exe"
# Setup test environment for Windows
  - copy "judger\src\test\resources\voj-test-windows.properties" "judger\src\test\resources\voj-test.properties"
# The sandbox runs programs as an account of its own, never the one that runs the tests: the judger
# refuses that one, whose network the sandbox would cut off. It needs the "Log on as a batch job"
# right; its password goes into the test configuration.
  - ps: |
      $password = 'Voj-' + [guid]::NewGuid().ToString('N')
      New-LocalUser -Name voj-sandbox -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires | Out-Null
      $sid = (Get-LocalUser voj-sandbox).SID.Value
      secedit /export /cfg "$env:TEMP\rights.inf" /areas USER_RIGHTS | Out-Null
      $line = Get-Content "$env:TEMP\rights.inf" | Where-Object { $_ -like 'SeBatchLogonRight*' }
      $right = if ($line) { "$line,*$sid" } else { "SeBatchLogonRight = *$sid" }
      Set-Content -Encoding Unicode "$env:TEMP\rights.inf" @('[Unicode]', 'Unicode=yes', '[Version]', 'signature="$CHICAGO$"', 'Revision=1', '[Privilege Rights]', $right)
      secedit /configure /db "$env:TEMP\rights.sdb" /cfg "$env:TEMP\rights.inf" /areas USER_RIGHTS /quiet | Out-Null
      Remove-Item "$env:TEMP\rights.inf", "$env:TEMP\rights.sdb"
      $properties = 'judger\src\test\resources\voj-test.properties'
      (Get-Content $properties) -replace '^system.password =.*', "system.password = $password" | Set-Content $properties

build: off

before_test:
# Make root password-less to match the test JDBC URL. The test suite provisions
# its own database (Spring runs sql/{schema,seed,test-data}.sql and the JDBC URL
# carries createDatabaseIfNotExist=true plus the required sql_mode), so no manual
# CREATE DATABASE / schema import / SET GLOBAL sql_mode is needed.
  - mysql -e "SET PASSWORD FOR 'root'@'localhost' = '';" --user=root --password=Password12!

test_script:
  - mvn test -f web\pom.xml
  - mvn test -f judger\pom.xml

on_finish:
  - ps: $blockRdp = $false; iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

matrix:
  fast_finish: false

cache:
  - C:\maven\
  - C:\Users\appveyor\.m2
