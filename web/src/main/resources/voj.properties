# The following line is used for #include attack
#if false

# Deployment knobs are resolved at runtime from environment variables, with the
# value after ':' used as the fallback. So every VOJ_* below can be overridden
# without rebuilding the jar, e.g. `docker run -e VOJ_DB_HOST=db.internal ...` or
# `VOJ_BASE_URL=https://oj.example.edu java -jar voj.web.jar`. The defaults keep a
# from-source local run (MySQL on localhost, no reverse proxy) working as before.

# Database Configuration
# A connection must be opened within connectTimeout ms, and a statement answered within
# socketTimeout ms: a connection that went silent (e.g. half-open after a network failure) fails
# then, rather than holding a request or a scheduled job (such as the one that marks the
# submissions no judger can take) up forever. Raise socketTimeout if a slow statistics query of the
# administration hits it.
jdbc.driverClassName = com.mysql.cj.jdbc.Driver
jdbc.url = jdbc:mysql://${VOJ_DB_HOST:localhost}:${VOJ_DB_PORT:3306}/${VOJ_DB_NAME:voj}?characterEncoding=UTF-8&autoReconnect=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=10000&socketTimeout=120000
jdbc.username = ${VOJ_DB_USERNAME:root}
jdbc.password = ${VOJ_DB_PASSWORD:}
jdbc.initialSize = 2
jdbc.maxActive = 8
jdbc.minIdle = 2
jdbc.maxWait = 30000
jdbc.timeBetweenEvictionRunsMillis = 60000
jdbc.minEvictableIdleTimeMillis = 25200000
jdbc.removeAbandoned = false
jdbc.removeAbandonedTimeout = 1800

# Mail Service Configuration
# The SMTP server password-reset and email-verification links are sent through (with STARTTLS).
# Empty: the site sends no email, and email verification cannot be required.
mail.host = ${VOJ_MAIL_HOST:}
mail.port = ${VOJ_MAIL_PORT:587}
mail.username = ${VOJ_MAIL_USERNAME:}
mail.password = ${VOJ_MAIL_PASSWORD:}
mail.senderMail = ${VOJ_MAIL_SENDER:noreply@example.com}
mail.senderName = ${VOJ_MAIL_SENDER_NAME:Verwandlung Online Judge}

# Message Service Configuration
# Every instance of the web application subscribes to the topic the judgers publish the progress of
# their judgings on (shown live on a submission's page).
jms.broker.url = ${VOJ_JMS_BROKER_URL:tcp://localhost:61616}

# Run the ActiveMQ broker embedded inside this web process instead of as a separate one. When true,
# the web app hosts the broker itself (in-process vm:// transport) and opens jms.broker.url as a TCP
# connector so out-of-process judgers can still connect — saving a whole standalone broker JVM
# (~150 MB+). The embedded broker is non-persistent, so a web restart drops the judgers' progress
# messages in flight (the verdicts are in the database); it also ties the broker's lifecycle to this
# single web instance, so do NOT enable it when running multiple web instances. When true, the
# deployment must NOT also start the standalone broker (both bind jms.broker.url). Default: false
# (use an external broker).
jms.broker.embedded = ${VOJ_JMS_BROKER_EMBEDDED:false}

# Checkpoint Distribution Configuration
# Shared secret a judger must present (X-Judger-Token header) to download a problem's test data from
# /api/judger/checkpoints/{problemId}. Must match judger.apiToken on every judger. An empty value
# disables the endpoint (all requests are refused). Change this to a long random string in production.
judger.apiToken = ${VOJ_JUDGER_API_TOKEN:}

# Judger Account
# The account the judgers sign in as (judger.username and judger.password of every judger). When
# judger.password is set, the web application makes this account a judger account (in the judgers
# group) with that password on startup: it creates it, or sets its password, but leaves a user of
# that name who is not a judger alone (and logs an error). Empty: the judger accounts are created in
# the administration only. The Docker image generates the password on the first start.
judger.username = ${VOJ_JUDGER_USERNAME:judger}
judger.password = ${VOJ_JUDGER_PASSWORD:}

# The judgers take the pending submissions from the database, oldest first, and record their
# heartbeats there. How long (ms) the pending submissions in a language wait while no running judger
# takes submissions in it (none supports it, the ones that do stopped, or are not ready as their
# judgings failed 3 times in a row) before they are marked as a System Error rather than staying
# Pending forever. A queue however long is never failed while a judger takes submissions in its
# language.
# 0: wait as long as it takes. Default: 5 minutes.
judging.noJudgerTimeout = 300000

# Web Service Configuration
# VOJ_BASE_URL is the site's public root (used in e-mails and absolute links);
# behind a reverse proxy set it to the externally visible URL, e.g.
# https://oj.example.edu. url.cdn defaults to VOJ_BASE_URL + /assets unless you
# serve static assets from a separate host via VOJ_CDN_URL.
url.base = ${VOJ_BASE_URL:http://localhost:8080/voj}
url.cdn = ${VOJ_CDN_URL:${VOJ_BASE_URL:http://localhost:8080/voj}/assets}

#endif
