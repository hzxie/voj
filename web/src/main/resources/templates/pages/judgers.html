<!DOCTYPE html>
<!--/* Reproduced from voj-design/Judgers.dc.html. KPIs + node cards are bound to live
       telemetry reported by each running judger's heartbeat (CPU/memory/uptime).
       Cluster KPIs the heartbeat cannot measure (queue depth, median latency, 30-day
       uptime) are replaced with real derived metrics: online count, avg CPU, avg memory.
       Styling lives in app.css; only data-driven bar widths stay as inline style. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}" lang="en">
<head>
    <title th:text="#{voj.misc.judgers.title} + ' | ' + ${websiteName}">Judgers</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- PAGE HEADER -->
        <section class="vw-pagehead">
            <div class="vw-eyebrow" th:text="'// ' + #{voj.misc.judgers.eyebrow}">// JUDGER CLUSTER</div>
            <h1 th:text="#{voj.misc.judgers.title}">Judgers</h1>
            <div class="sub vw-livesub"><span th:text="#{voj.misc.judgers.subtitle}">distributed via ActiveMQ</span> <span class="vw-livedot"></span></div>
        </section>

        <!-- KPIs -->
        <section class="vw-section">
            <div class="vw-kpis">
                <div class="vw-kpi"><div class="v accent" th:text="${onlineJudgers}">0</div><div class="k" th:text="#{voj.misc.judgers.kpi-online}">JUDGERS ONLINE</div></div>
                <div class="vw-kpi"><div class="v" th:text="${averageCpuLoad < 0 ? '—' : averageCpuLoad + '%'}">0%</div><div class="k" th:text="#{voj.misc.judgers.kpi-avg-cpu}">AVG CPU LOAD</div></div>
                <div class="vw-kpi"><div class="v" th:text="${averageMemoryUsage < 0 ? '—' : averageMemoryUsage + '%'}">0%</div><div class="k" th:text="#{voj.misc.judgers.kpi-avg-memory}">AVG MEMORY</div></div>
                <div class="vw-kpi"><div class="v" th:text="${numberOfNodes}">0</div><div class="k" th:text="#{voj.misc.judgers.kpi-nodes}">NODES</div></div>
            </div>
        </section>

        <!-- JUDGER NODES -->
        <section class="vw-section">
            <div class="vw-section-label" th:text="'// ' + #{voj.misc.judgers.nodes}">// NODES</div>
            <div class="vw-jgrid">
                <div class="vw-jcard is-online" th:each="node : ${judgers}">
                    <div class="vw-jcard-head">
                        <span class="vw-jcard-dot on"></span>
                        <span class="vw-jcard-name" th:text="${node.username}">judger</span>
                        <span class="vw-jcard-status on" th:text="#{voj.misc.judgers.status-online}">status</span>
                    </div>
                    <div class="vw-jcard-spec" th:text="${node.description}">8 vCPU &middot; 16 GB</div>
                    <div class="vw-bar" th:with="lvl=${node.cpuLoad >= 80 ? 'high' : (node.cpuLoad >= 60 ? 'mid' : 'low')}">
                        <div class="vw-bar-top"><span class="lbl" th:text="#{voj.misc.judgers.cpu-load}">CPU LOAD</span><span th:classappend="|vw-load-${lvl}|" th:text="${node.cpuLoad} + '%'">0%</span></div>
                        <div class="vw-bar-track"><div class="vw-bar-fill" th:classappend="|vw-bar-${lvl}|" th:style="|width:${node.cpuLoad}%|"></div></div>
                    </div>
                    <div class="vw-bar">
                        <div class="vw-bar-top"><span class="lbl" th:text="#{voj.misc.judgers.memory}">MEMORY</span><span class="vw-muted2" th:text="${node.memoryUsage} + '%'">0%</span></div>
                        <div class="vw-bar-track"><div class="vw-bar-fill vw-bar-mem" th:style="|width:${node.memoryUsage}%|"></div></div>
                    </div>
                    <div class="vw-jcard-foot">
                        <span><span th:text="#{voj.misc.judgers.uptime}">uptime</span> <b th:text="${node.uptime}">31d</b></span>
                    </div>
                </div>
                <div class="vw-table-empty" th:if="${judgers == null or judgers.isEmpty()}" th:text="'// ' + #{voj.misc.judgers.no-judgers}">// no judgers registered</div>
            </div>
        </section>
    </div>
</body>
</html>
