<!DOCTYPE html>
<!--/*
  Public site header (terminal aesthetic). Used via ~{fragments/header :: header}.
  The active navigation item is derived from the current request URI (forwardUri,
  injected by CommonModelPopulator) so no per-page parameter is needed. Styling
  lives in css/app.css (.vw-header / .vw-nav / .vw-menu / ...); behaviour (theme
  toggle, burger) lives in js/theme.js.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="header"
        th:with="uri=${forwardUri != null ? forwardUri : ''},
                 navP=${#strings.endsWith(uri,'/p') or #strings.contains(uri,'/p/')},
                 navD=${#strings.contains(uri,'/discussion')},
                 navC=${#strings.contains(uri,'/contest')},
                 navS=${#strings.contains(uri,'/submission')}">
    <header class="vw-header">
        <a class="vw-logo" th:href="@{/}">
            <span class="b">&lt;</span><span class="n">verwandlung</span><span class="b">&gt;</span><span class="vw-cursor">_</span>
        </a>
        <nav class="vw-nav">
            <a th:href="@{/p}" th:classappend="${navP}? 'active'" th:text="'~/' + #{voj.include.header.nav-problems}">~/problems</a>
            <a th:href="@{/discussion}" th:classappend="${navD}? 'active'" th:text="'~/' + #{voj.include.header.nav-discussion}">~/discussion</a>
            <a th:href="@{/contest}" th:classappend="${navC}? 'active'" th:text="'~/' + #{voj.include.header.nav-contests}">~/contests</a>
            <a th:href="@{/submission}" th:classappend="${navS}? 'active'" th:text="'~/' + #{voj.include.header.nav-submission}">~/submission</a>
        </nav>
        <div class="vw-header-spacer"></div>
        <button th:replace="~{fragments/chrome :: theme-toggle('vw-toggle')}"></button>
        <th:block th:if="${isLogin}">
            <a th:if="${myProfile.userGroup != null and myProfile.userGroup.userGroupSlug == 'administrators'}" class="vw-header-link vw-desktop-only" th:href="@{/administration}" th:text="'~/' + #{voj.include.header.nav-admin}">~/admin</a>
            <a class="vw-header-link vw-desktop-only" th:href="@{/accounts/user/{uid}(uid=${myProfile.uid})}" th:text="|~/${myProfile.username}|">~/user</a>
            <!--/* Logging out changes state, so it is a CSRF-protected POST: the sign-out
                   buttons (here and in the mobile menu) submit the hidden form below. */-->
            <button type="submit" form="vw-logout-form" class="vw-btn vw-btn-ghost vw-btn-sm vw-desktop-only" th:text="#{voj.include.header.sign-out}">sign out</button>
            <form id="vw-logout-form" method="post" th:attr="action=@{/accounts/logout}" hidden>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            </form>
        </th:block>
        <th:block th:unless="${isLogin}">
            <a class="vw-header-link vw-desktop-only" th:href="@{/accounts/login(forward=${forwardUri})}" th:text="#{voj.include.header.sign-in}">login</a>
            <a class="vw-btn vw-btn-accent vw-btn-sm vw-desktop-only" th:href="@{/accounts/register(forward=${forwardUri})}" th:text="'$ ' + #{voj.include.header.create-account}">$ create-account</a>
        </th:block>
        <!--/* popovertarget gives the menu light dismiss, Esc and focus return, and exposes
               the expanded state; js/theme.js only steps in where popover is unsupported. */-->
        <button class="vw-burger" data-vw="burger" type="button" popovertarget="vw-menu"
                th:title="#{voj.include.header.menu}" th:aria-label="#{voj.include.header.menu}">
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
    </header>

    <!-- Mobile navigation menu (a popover toggled by the burger). -->
    <nav id="vw-menu" class="vw-menu" data-vw="menu" popover th:aria-label="#{voj.include.header.menu}">
        <a th:href="@{/p}" th:classappend="${navP}? 'active'" th:text="'~/' + #{voj.include.header.nav-problems}">~/problems</a>
        <a th:href="@{/discussion}" th:classappend="${navD}? 'active'" th:text="'~/' + #{voj.include.header.nav-discussion}">~/discussion</a>
        <a th:href="@{/contest}" th:classappend="${navC}? 'active'" th:text="'~/' + #{voj.include.header.nav-contests}">~/contests</a>
        <a th:href="@{/submission}" th:classappend="${navS}? 'active'" th:text="'~/' + #{voj.include.header.nav-submission}">~/submission</a>
        <a th:if="${isLogin and myProfile.userGroup != null and myProfile.userGroup.userGroupSlug == 'administrators'}" th:href="@{/administration}" th:text="'~/' + #{voj.include.header.nav-admin}">~/admin</a>
        <div class="vw-menu-actions" th:if="${isLogin}">
            <a class="vw-btn vw-btn-ghost" th:href="@{/accounts/user/{uid}(uid=${myProfile.uid})}" th:text="|~/${myProfile.username}|">~/user</a>
            <button type="submit" form="vw-logout-form" class="vw-btn vw-btn-accent" th:text="#{voj.include.header.sign-out}">sign out</button>
        </div>
        <div class="vw-menu-actions" th:unless="${isLogin}">
            <a class="vw-btn vw-btn-ghost" th:href="@{/accounts/login(forward=${forwardUri})}" th:text="#{voj.include.header.sign-in}">login</a>
            <a class="vw-btn vw-btn-accent" th:href="@{/accounts/register(forward=${forwardUri})}" th:text="'$ ' + #{voj.include.header.create-account}">$ create-account</a>
        </div>
    </nav>
    </th:block>
</body>
</html>
