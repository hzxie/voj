<!DOCTYPE html>
<!--/*
  Public site header (terminal aesthetic). Used via ~{fragments/header :: header}.
  The active navigation item is derived from the current request URI (forwardUri,
  injected by CommonModelPopulator) so no per-page parameter is needed. Styling
  lives in css/app.css (.vw-header / .vw-site-nav / .vw-menu / ...); behaviour (theme
  toggle, collapsing navigation) lives in js/theme.js.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="header"
        th:with="uri=${forwardUri != null ? forwardUri : ''},
                 navP=${#strings.endsWith(uri,'/p') or #strings.contains(uri,'/p/')},
                 navD=${#strings.contains(uri,'/discussion')},
                 navC=${#strings.contains(uri,'/contest')},
                 navS=${#strings.contains(uri,'/submission')}">
    <!--/* One navigation tree at every width (see the navbar pattern in js/theme.js):
           the list is a popover opened by the menu button, and becomes the inline row
           (header.is-wide) whenever brand + links + account actions fit on one line.
           Without script the header simply stays collapsed. */-->
    <header class="vw-header" data-vw="site-header">
        <a class="vw-logo" th:href="@{/}">
            <span class="b">&lt;</span><span class="n">verwandlung</span><span class="b">&gt;</span><span class="vw-cursor">_</span>
        </a>
        <nav class="vw-site-nav" th:aria-label="#{voj.include.header.main-navigation}">
            <button class="vw-burger" data-vw="burger" type="button" popovertarget="vw-menu" aria-controls="vw-menu"
                    th:title="#{voj.include.header.menu}" th:aria-label="#{voj.include.header.menu}">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
            <ul id="vw-menu" class="vw-menu" data-vw="menu" popover="auto">
                <li><a th:href="@{/p}" th:aria-current="${navP} ? 'page'" th:text="'~/' + #{voj.include.header.nav-problems}">~/problems</a></li>
                <li><a th:href="@{/discussion}" th:aria-current="${navD} ? 'page'" th:text="'~/' + #{voj.include.header.nav-discussion}">~/discussion</a></li>
                <li><a th:href="@{/contest}" th:aria-current="${navC} ? 'page'" th:text="'~/' + #{voj.include.header.nav-contests}">~/contests</a></li>
                <li><a th:href="@{/submission}" th:aria-current="${navS} ? 'page'" th:text="'~/' + #{voj.include.header.nav-submission}">~/submission</a></li>
                <th:block th:if="${isLogin}">
                    <li class="vw-menu-account" th:if="${myProfile.userGroup != null and myProfile.userGroup.userGroupSlug == 'administrators'}">
                        <a th:href="@{/administration}" th:text="'~/' + #{voj.include.header.nav-admin}">~/admin</a>
                    </li>
                    <li class="vw-menu-account"><a th:href="@{/accounts/user/{uid}(uid=${myProfile.uid})}" th:text="|~/${myProfile.username}|">~/user</a></li>
                    <!--/* Logging out changes state, so it is a CSRF-protected POST: this button
                           submits the hidden form below. */-->
                    <li class="vw-menu-account"><button type="submit" form="vw-logout-form" class="vw-btn vw-btn-ghost vw-btn-sm" th:text="#{voj.include.header.sign-out}">sign out</button></li>
                </th:block>
                <th:block th:unless="${isLogin}">
                    <li class="vw-menu-account"><a th:href="@{/accounts/login(forward=${forwardUri})}" th:text="#{voj.include.header.sign-in}">login</a></li>
                    <li class="vw-menu-account"><a class="vw-btn vw-btn-accent vw-btn-sm" th:href="@{/accounts/register(forward=${forwardUri})}" th:text="'$ ' + #{voj.include.header.create-account}">$ create-account</a></li>
                </th:block>
            </ul>
        </nav>
        <button th:replace="~{fragments/chrome :: theme-toggle('vw-toggle')}"></button>
        <form th:if="${isLogin}" id="vw-logout-form" method="post" th:attr="action=@{/accounts/logout}" hidden>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
    </header>
    </th:block>
</body>
</html>
