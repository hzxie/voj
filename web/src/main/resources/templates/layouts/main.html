<!DOCTYPE html>
<!--/*
  The master layout for the public-facing site. Pages decorate it with
  layout:decorate="~{layouts/main}" and supply their unique markup through the
  layout:fragment="content" hole and, optionally, page-specific <head> elements
  (stylesheets/<title>) and bottom-of-body scripts via layout:fragment="scripts".

  The CDN base URL (cdnUrl), the cache-busting key (version), the display
  language, the logged-in profile and the system options (websiteName, ...) are
  all injected into the model by CommonModelInterceptor (and, for the error
  pages, by ExceptionHandlingController), so every page can rely on them.

  UI system: terminal aesthetic driven by css/app.css (CSS variables + reusable
  .vw-* components) and js/theme.js (theme toggle, language menu, confirm dialog).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#strings.replace(language, '_', '-')}" lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <!--/* color-scheme meta + pre-paint theme resolution (stored override, else system). */-->
    <th:block th:replace="~{fragments/chrome :: theme-head}"></th:block>
    <!-- Analytics (rendered only when configured). The gtag.js snippet is async, so placing it
         high in <head> — Google's recommendation — captures the pageview early without blocking. -->
    <th:block th:if="${googleAnalyticsCode != null and googleAnalyticsCode != ''}" th:utext="${googleAnalyticsCode}"></th:block>
    <title th:text="${websiteName}">Verwandlung Online Judge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search engine and link-preview metadata. Detail pages supply pageDescription (and their
         own og:title); the other pages fall back to the site-wide description and <title>. -->
    <meta name="description" th:content="${pageDescription ?: description}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" th:content="${websiteName}" />
    <meta property="og:description" th:content="${pageDescription ?: description}" />
    <meta property="og:image" th:content="|${cdnUrl}/img/apple-touch-icon.png|" />
    <meta name="twitter:card" content="summary" />
    <!-- One URL per display language (?language=xx_XX); see CommonModelPopulator.addLanguageUrls. -->
    <link rel="canonical" th:href="${canonicalUrl}" />
    <link th:each="alternate : ${alternateUrls}" rel="alternate" th:hreflang="${alternate.key}" th:href="${alternate.value}" />
    <meta name="author" content="Haozhe Xie" />
    <!-- CSRF token for AJAX requests (consumed by the ajaxSend hook in site.js). -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <!-- Icon -->
    <link th:href="|${cdnUrl}/img/favicon.svg?v=${version}|" rel="icon" type="image/svg+xml" />
    <link th:href="|${cdnUrl}/img/favicon.ico?v=${version}|" rel="alternate icon" type="image/x-icon" />
    <link th:href="|${cdnUrl}/img/apple-touch-icon.png?v=${version}|" rel="apple-touch-icon" />
    <!-- UI system (self-hosted fonts + theme variables + components live in app.css). -->
    <link rel="stylesheet" type="text/css" th:href="|${cdnUrl}/css/app.css?v=${version}|" />
</head>
<body>
    <div class="vw-app">
        <!-- Decorative scanline overlay. -->
        <div class="vw-scanlines" aria-hidden="true"></div>
        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>
        <!-- Content -->
        <main class="vw-main">
            <th:block layout:fragment="content"></th:block>
        </main>
        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <!-- Shared modal behind vojConfirm() / vojAlert() (js/theme.js). -->
    <dialog th:replace="~{fragments/chrome :: dialog}"></dialog>
    <!-- jQuery (page AJAX still uses it). Loaded at the end of <body> so it does not block rendering. -->
    <script type="text/javascript" th:src="|${cdnUrl}/js/jquery-3.7.1.min.js?v=${version}|"></script>
    <!-- UI chrome behaviour (theme toggle, language menu, vojConfirm / vojAlert). -->
    <script type="text/javascript" th:src="|${cdnUrl}/js/theme.js?v=${version}|"></script>
    <!-- Site-wide JavaScript (CSRF token wiring for AJAX). -->
    <script type="text/javascript" th:src="|${cdnUrl}/js/site.js?v=${version}|"></script>
    <!-- Translated labels for the shared scripts (window.vojMessages). -->
    <script th:replace="~{fragments/chrome :: client-messages}"></script>
    <!-- Markdown rendering (markdown-it) + shared helpers (renderMarkdown / createMarkdownEditor). -->
    <script type="text/javascript" th:src="|${cdnUrl}/js/markdown-it.min.js?v=${version}|"></script>
    <script type="text/javascript" th:src="|${cdnUrl}/js/markdown.js?v=${version}|"></script>
    <!-- Page-specific bottom-of-body scripts. -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
